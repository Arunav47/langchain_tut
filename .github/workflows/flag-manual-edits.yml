name: Flag manual check-ins

on:
    pull_request_target:
        branches: [main]
        types: [opened, synchronize, reopened]
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true
jobs:
    cancel-superseded:
        runs-on: ubuntu-latest
        permissions: 
            actions: write
        steps:
            - name: Cancel older runs still pending/waiting for this PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  CURRENT_RUN_ID: ${{ github.run_id }}
              run: |
                  set -euo pipefail
                  RUN_IDS=$(gh api "repos/$GH_REPO/actions/workflows/flag-manual-edits.yml/runs?event=pull_request_target&per_page=20" \
                   --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.head_branch == \"$HEAD_REF\") | select(.id != $CURRENT_RUN_ID) | .id] | .[]")

                  for run_id in $RUN_IDS; do
                      echo "Cancelling superseded run $run_id for branch $HEAD_REF"
                      gh api -X POST "repos/$GH_REPO/actions/runs/$run_id/cancel" \
                       || echo "::warning::Failed to cancel superseded run $run_id - it may already have completed."
                  done
                  
    detect:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        outputs:
            flagged: ${{ steps.check.outputs.flagged }}
            flagged_str: ${{ steps.check.outputs.flagged_str }}
        steps:
            -   name: Check commit provenance
                id: check
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    HEAD_REF: ${{ github.event.pull_request.head.ref }}
                    MERGER_EMAIL: "arunavborthakur2020@gmail.com"
                
                run: |
                    set -euo pipefail
                    
                    NON_MERGER_SHAS=$(gh pr view $PR_NUMBER --json commits \
                    --jq "[.commits[] | select(.author.email != \"$MERGER_EMAIL\") | .oid] | join(\" \")")

                    CHECKED_FOLDER_RE="Checking_Similarity/*"

                    FLAGGED=()
                    for sha in $NON_MERGER_SHAS; do
                        TOUCHES_CHECKED_FOLDER=$(gh api "repos/$GH_REPO/commits/$sha" \
                            --jq "[.files[] | select(.filename | test(\"$CHECKED_FOLDER_RE\"))] | length")
                        if [[ "$TOUCHES_CHECKED_FOLDER" -gt 0 ]]; then
                            FLAGGED+=("$sha")
                        fi
                    done

                    if [ "${#FLAGGED[@]}" -eq 0 ]; then
                        echo "No manual check-ins detected."
                        echo "flagged=false" >> $GITHUB_OUTPUT
                        echo "flagged_str=" >> $GITHUB_OUTPUT
                        exit 0
                    fi
                    
                    FLAGGED_STR=$(IFS=', '; echo "${FLAGGED[*]}")

                    echo "flagged=true" >> $GITHUB_OUTPUT
                    echo "flagged_str=$FLAGGED_STR" >> $GITHUB_OUTPUT

                    echo "::warning::PR contains commits by non-merger authors that touch the 'Checking_Similarity' folder: $FLAGGED_STR"

                    MARKER="Manula check-in detected. Please ensure that all changes to the 'Checking_Similarity' folder are reviewed and approved by the appropriate team members."
                    ALREADY_FLAGGED=$(gh pr view $PR_NUMBER --json comments \
                    --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")

                    if [[ "$ALREADY_FLAGGED" -eq 0 ]]; then
                        gh pr comment $PR_NUMBER --body "$MARKER" || echo "::warning::Failed to post the PR comment."
                    fi

    require-bypass-approval:
        needs: detect
        if: always() && (needs.detect.result == 'failure' || needs.detect.outputs.flagged == 'true')
        runs-on: ubuntu-latest
        environment: 
           name: non-merger-override
           deployment: false
        permissions: {}
        steps:
            -   name: Bypass approval
                run: echo "Approved via the non-merger-override environment for flagged manual check-ins."
    enforce:
        needs: [detect, require-bypass-approval]
        if: always()
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Verify gate outcome
              run: |
                  DETECT_RESULT="${{needs.detect.result}}"
                  FLAGGED="${{needs.detect.outputs.flagged}}"
                  APPROVAL_RESULT="${{needs.require-bypass-approval.result}}"
                  if [ "$DETECT_RESULT" != "success" ]; then
                      echo "::error::detect did not complete successfully (result: $DETECT_RESULT) - failing closed"
                      exit 1
                  fi

                  if [ "$FLAGGED" == "true" ] && [ "$APPROVAL_RESULT" != "success" ]; then
                      echo "::error::PR flags a manual edit to generated output, but require-bypass-approval did not succes (result: $APPROVAL_RESULT) - failing closed."
                      exit 1
                  fi

                  echo "Gate satisfied (detect: $DETECT_RESULT, flagged: $FLAGGED, approval:$APPROVAL_RESULT)."
